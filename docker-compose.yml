services:
  postgres:
    image: postgres:16-alpine
    container_name: agnyusha-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: agnyusha
      POSTGRES_PASSWORD: agnyusha
      POSTGRES_DB: agnyusha
    volumes:
      - agnyusha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnyusha -d agnyusha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agnyusha_pg_data:
